services:
  - type: web
    name: studymate-upload
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 45 --access-logfile -
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_PATH
        value: /tmp/studymate-pending.sqlite3
      - key: PYTHON_VERSION
        value: '3.12.12'
